name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 华为杯研赛 AI 作战中枢 持续集成（Wave5-C）
# Ubuntu + Python 3.12（兼容性最稳）；装依赖后跑完整 pytest。
# CI 无 MATLAB 时校验已提交的 R2024b 真机证据；有 MATLAB 时自动真机运行。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装中文字体与 XeLaTeX（路线图和 PDF 集成测试）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk \
            fonts-texgyre \
            fonts-texgyre-math \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-plain-generic \
            texlive-xetex

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit==1.9.4 detect-secrets==1.5.0 pip-audit==2.10.1 ruff==0.13.2

      - name: 依赖与安全审计
        run: |
          python -m pip check
          python -m pip_audit -r requirements.txt --progress-spinner off
          python -m bandit -q -r scripts skills/academic-figure/scripts skills/academic-figure/assets/figures -ll
          # The two manifests below contain published Git/SHA checksums, not credentials.
          python -m detect_secrets scan --all-files --exclude-lines 'detect[-_]secrets|paper-checklist-provenance' --exclude-files '(^|[\\/])(\.git|__pycache__|\.pytest_cache|\.ruff_cache)([\\/]|$)|\.eval_results\.json$|(^|[\\/])assets[\\/]paper-template[\\/]reference-23rd-latex[\\/]source-manifest\.json$|(^|[\\/])skills[\\/]academic-figure[\\/]references[\\/]figures4papers\.lock\.json$' > /tmp/secrets.json
          python -c 'import json; data=json.load(open("/tmp/secrets.json", encoding="utf-8")); assert not data["results"], data["results"]'

      - name: 全仓静态与语法检查
        run: |
          python -m ruff check . --select E9,F,B
          python -m compileall -q scripts skills/academic-figure

      - name: 运行测试
        run: python -m pytest tests/ -q -ra

      # 说明：
      # - CI 已安装 Noto CJK、TeX Gyre 与 XeLaTeX；绘图字体和 PDF 编译测试均按真实运行时执行。
      # - MATLAB 用例在 CI 无 matlab.exe 时校验 R2024b 真机证据日志，不产生 skip。
