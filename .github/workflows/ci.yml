name: CI

# 华为杯研赛 AI 作战中枢 持续集成（Wave5-C）
# Ubuntu + Python 3.12（兼容性最稳）；装依赖后跑 pytest 与 doctor 自检。
# CI 无 MATLAB 时校验已提交的 R2024b 真机证据；有 MATLAB 时自动真机运行。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装中文字体（路线图渲染）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 环境自检（doctor.py --json）
        # CI runner 无 xelatex/MATLAB/Word，doctor 会报 FAIL；用 continue-on-error 仅展示不阻塞。
        continue-on-error: true
        run: python scripts/doctor.py --json

      - name: 运行测试
        run: python -m pytest tests/ -v

      # 说明：
      # - CI 已安装 Noto CJK；严格绘图测试把缺少中文字体视为失败，生产渲染器仍保留英文回退。
      # - MATLAB 用例在 CI 无 matlab.exe 时校验 R2024b 真机证据日志，不产生 skip。
